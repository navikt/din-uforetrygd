apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    team: ufore
  name: din-uforetrygd-alerts
  namespace: ufore
spec:
  groups:
    - name: din-uforetrygd-alerts
      rules:
        - alert: "For mange serverfeil"
          expr: |
            round(
                sum(rate(http_server_requests_seconds_count{app=~"din-uforetrygd-.*", status=~"[5].."}[5m])) by (app, uri) / sum(rate(http_server_requests_seconds_count{app=~"din-uforetrygd-backend"}[5m])) by (app, uri) * 100 
            ) > 10
          for: 3m
          annotations:
            message: "*{{ $labels.app }}*: {{ $value }}% 5xx-feil fra `{{ $labels.uri }}` siste 3 min!"
          labels:
            severity: error
            namespace: ufore
            ufore_alerts: slack
            alert_type: custom
