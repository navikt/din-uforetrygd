name: Bygg din-uforetrygd-backend
on:
  workflow_dispatch:
  push:
    paths:
      - din-uforetrygd-backend/**
    branches-ignore:
      - main  # Bygges allerede av deploy-workflow

jobs:
  build-backend:
    name: Bygg med maven
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Bygg
        run: cd ./din-uforetrygd-backend && mvn -B package --file pom.xml