name: Bygg din-uforetrygd-backend
on:
  workflow_dispatch:
  push:
    paths:
      - din-uforetrygd-backend/**
    branches-ignore:
      - main  # Bygges allerede av deploy-workflow

jobs:
  build-backend:
    name: Bygg med maven
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
      - name: Setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Bygg
        run: cd ./uforetrygd-backend && mvn -B package --file pom.xml