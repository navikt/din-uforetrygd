name: Bygg din-uforetrygd-frontend
on:
  workflow_dispatch:
  push:
    paths:
      - din-uforetrygd-frontend/**
    branches-ignore:
      - main  # Bygges allerede av deploy-workflow

jobs:
  build-frontend:
    name: Bygg med node
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          cache: npm
          cache-dependency-path: din-uforetrygd-frontend/package-lock.json

      - name: Cache node modules
        id: cache-node
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            din-uforetrygd-frontend/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Installer avhengigheter
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: cd din-uforetrygd-frontend && npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Lint
        run: cd din-uforetrygd-frontend && npm run check

      - name: Bygg med node
        run: cd din-uforetrygd-frontend && npm run build
        env:
          FARO_TELEMETRY_URL: 'https://telemetry.ekstern.dev.nav.no/collect'
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}