name: "Dev: Din uforetrygd frontend deploy"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - din-uforetrygd-frontend/**

concurrency:
  group: dev-din-uforetrygd-frontend-deploy
  cancel-in-progress: true

jobs:
  build-frontend-and-publish-docker:
    name: Bygg din-uforetrygd-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./din-uforetrygd-frontend/
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Bruk node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          cache: npm
          cache-dependency-path: din-uforetrygd-frontend/package-lock.json

      - name: Installer avhengigheter
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Bygg med node
        run: npm run build

      - name: Prune dev-avhengigheter
        run: npm prune --production

      - name: docker-build-push
        uses: nais/docker-build-push@cd5ec5663feb0e05c3fa374d1fb442605b046c6b # v0
        id: docker-build-push
        with:
          team: ufore
          dockerfile: ./din-uforetrygd-frontend/.docker/Dockerfile
          image_suffix: din-uforetrygd-frontend


  deploy-frontend-borger-dev:
    needs: build-frontend-and-publish-docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Deploy
        uses: nais/deploy/actions/deploy@fa754451577294aae42872a69b888b3470478ec1 # v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: din-uforetrygd-frontend/.nais/dev-borger.yml,din-uforetrygd-frontend/.nais/unleash-dev.yml
          IMAGE: ${{ needs.build-frontend-and-publish-docker.outputs.image }}
          TEAM: ufore


  deploy-frontend-veileder-dev:
    needs: build-frontend-and-publish-docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Deploy
        uses: nais/deploy/actions/deploy@fa754451577294aae42872a69b888b3470478ec1 # v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: din-uforetrygd-frontend/.nais/dev-veileder.yml,din-uforetrygd-frontend/.nais/unleash-dev.yml
          IMAGE: ${{ needs.build-frontend-and-publish-docker.outputs.image }}
          TEAM: ufore