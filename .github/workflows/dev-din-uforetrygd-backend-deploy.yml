name: "Dev: Din uforetrygd backend deploy"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * SUN'

jobs:
  build-backend-and-publish-docker:
    name: Bygg backend application
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build
        run: cd ./din-uforetrygd-backend && mvn -B package --file pom.xml

      - name: docker-build-push
        uses: nais/docker-build-push@v0
        id: docker-build-push
        with:
          team: ufore
          dockerfile: ./din-uforetrygd-backend/Dockerfile
          image_suffix: din-uforetrygd-backend

  deploy-to-dev:
    needs: build-backend-and-publish-docker
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Deploy
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: din-uforetrygd-backend/.nais/dev.yml
          IMAGE: ${{ needs.build-backend-and-publish-docker.outputs.image }}
          TEAM: ufore