apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: uforetrygd-frontend-borger-q2
  namespace: pensjonselvbetjening
  labels:
    team: pensjonselvbetjening
  annotations:
    nais.io/run-as-user: "101" # nginx
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
spec:
  image: "{{ image }}"
  ingresses:
    - https://uforetrygd-selvbetjening-frontend-borger-q2.intern.dev.nav.no/uforetrygd/selvbetjening
    - https://uforetrygd-selvbetjening-frontend-borger-q2.ansatt.dev.nav.no/uforetrygd/selvbetjening

  port: 8080
  replicas:
    min: 2
    max: 2
  liveness:
    path: /internal/health/liveness
    initialDelay: 20
    periodSeconds: 20
    failureThreshold: 5
    timeout: 1
  readiness:
    path: /internal/health/readiness
    initialDelay: 20
    periodSeconds: 20
    failureThreshold: 5
    timeout: 1
#  frontend:
#    generatedConfig:
#      mountPath: /usr/share/nginx/html/assets/nais.js
  idporten:
    enabled: true
    sidecar:
      level: idporten-loa-substantial
      enabled: true
      autoLogin: true
      autoLoginIgnorePaths:
        - /internal/ping
  tokenx:
    enabled: true
#  accessPolicy:
#    outbound:
#      rules:
#        - application: uforetrygd-backend-q2
  env:
    - name: MODE
      value: borger
    - name: DECORATOR_ENV
      value: dev
