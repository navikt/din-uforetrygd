query ($ident: String!, $tema: [Tema]!) {
    dokumentoversiktSelvbetjening(ident: $ident, tema: $tema) {
        journalposter {
            tittel
            journalpostId
            journalposttype
            tema
            sak {
                fagsakId
            }
            avsender {
                id
            }
            mottaker {
                id
            }
            datoSortering
            dokumenter {
                tittel
                dokumentInfoId
                dokumentvarianter{
                    variantformat
                    brukerHarTilgang
                    filtype
                    filstorrelse
                }
            }
        }
    }
}